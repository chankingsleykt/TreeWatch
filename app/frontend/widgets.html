<div class="year-picker">
  <label class="year-picker__label" for="year-slider">Year</label>
  <output class="year-picker__value" id="year-value" for="year-slider">2024</output>
  <input
    class="year-picker__slider"
    id="year-slider"
    type="range"
    min="2001"
    max="2026"
    value="2024"
    step="1"
  />
  <div class="year-picker__bounds" aria-hidden="true">
    <span>2001</span>
    <span>2026</span>
  </div>
</div>
