<div class="year-picker">
  <label class="year-picker__label" for="year-slider">Year</label>
  <output class="year-picker__value" id="year-value" for="year-slider">2024</output>
  <input
    class="year-picker__slider"
    id="year-slider"
    type="range"
    min="2014"
    max="2026"
    value="2024"
    step="1"
  />
  <div class="year-picker__bounds" aria-hidden="true">
    <span>2014</span>
    <span>2026</span>
  </div>
</div>

<div class="compare-toggle">
  <label class="compare-toggle__label" for="compare-hansen">
    <input
      class="compare-toggle__checkbox"
      id="compare-hansen"
      type="checkbox"
      checked
    />
    <span class="compare-toggle__text">Compare Hansen</span>
  </label>
</div>

<div class="confusion-legend" id="confusion-legend" aria-label="Confusion matrix legend">
  <div class="confusion-legend__title">Legend</div>
  <ul class="confusion-legend__list">
    <li class="confusion-legend__item">
      <span class="confusion-legend__swatch confusion-legend__swatch--tp" aria-hidden="true"></span>
      <span class="confusion-legend__label">True Positive</span>
    </li>
    <li class="confusion-legend__item">
      <span class="confusion-legend__swatch confusion-legend__swatch--tn" aria-hidden="true"></span>
      <span class="confusion-legend__label">True Negative</span>
    </li>
    <li class="confusion-legend__item">
      <span class="confusion-legend__swatch confusion-legend__swatch--fp" aria-hidden="true"></span>
      <span class="confusion-legend__label">False Positive</span>
    </li>
    <li class="confusion-legend__item">
      <span class="confusion-legend__swatch confusion-legend__swatch--fn" aria-hidden="true"></span>
      <span class="confusion-legend__label">False Negative</span>
    </li>
  </ul>
  <p class="confusion-legend__note">Positive = loss</p>
</div>
