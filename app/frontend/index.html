<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI + MapLibre + Draw</title>
    
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>

    <link href="https://unpkg.com/@mapbox/mapbox-gl-draw@1.4.3/dist/mapbox-gl-draw.css" rel="stylesheet" />
    <script src="https://unpkg.com/@mapbox/mapbox-gl-draw@1.4.3/dist/mapbox-gl-draw.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/geotiff"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { width: 100%; height: 100%; }

        /* Increase the physical size of the control buttons */
        .mapboxgl-ctrl-group button {
            width: 45px !important;
            height: 45px !important;
        }

        /* Scale up the SVG icons inside the buttons so they don't look tiny */
        .mapboxgl-ctrl-group button .mapbox-gl-draw_ctrl-draw-btn .mapboxgl-ctrl-icon,
        .mapboxgl-ctrl-icon {
            transform: scale(1.5); 
        }
    </style>
</head>
<body>

<div id='map'></div>

<script>
    // Initialize MapLibre Map
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/liberty', 
        center: [-95.7129, 37.0902],
        zoom: 3
    });

    // manually set the prefixes of the MapBox class to connect to maplibre instead
    MapboxDraw.constants.classes.CONTROL_BASE  = 'maplibregl-ctrl';
    MapboxDraw.constants.classes.CONTROL_PREFIX = 'maplibregl-ctrl-';
    MapboxDraw.constants.classes.CONTROL_GROUP = 'maplibregl-ctrl-group';
    // Initialize Mapbox Draw
    const draw = new MapboxDraw({
        displayControlsDefault: false,
        controls: {
            polygon: true,
            trash: true
        }
    });

    // Add the draw control to the map
    map.addControl(draw, 'top-left');

    map.on('load', () => {
        map.getCanvas().classList.add('mapboxgl-canvas');
        map.getContainer().classList.add('mapboxgl-map');
    });

    // Listen for when a user finishes drawing a polygon
    map.on('draw.create', sendPolygonToBackend);
    map.on('draw.update', sendPolygonToBackend);
    
    // Listen for deletion to clean up the overlay
    map.on('draw.delete', () => {
        if (map.getLayer('prediction-overlay-layer')) map.removeLayer('prediction-overlay-layer');
        if (map.getSource('prediction-overlay')) map.removeSource('prediction-overlay');
    });

    async function sendPolygonToBackend(e) {
        // 1. Capture GeoJSON
        const data = draw.getAll();
        if (data.features.length === 0) return;

        // Get the most recently drawn feature
        const latestFeature = data.features[data.features.length - 1];

        try {
            // 2. API Call to FastAPI
            const response = await fetch('api/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(latestFeature)
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            // 3. Get raw binary array buffer
            const arrayBuffer = await response.arrayBuffer();

                    // --- THE DIAGNOSTIC FIX ---
            // TIFF files are physically required to begin with 'II' (73, 73) for Little-Endian 
            // or 'MM' (77, 77) for Big-Endian. 
            const view = new Uint8Array(arrayBuffer);
            
            if (view[0] !== 73 && view[0] !== 77) {
                // If the first byte isn't 73 or 77, FastAPI did not send a binary image.
                // It almost certainly sent a JSON error or text traceback.
                // We decode the raw binary buffer back into UTF-8 text so you can read the error.
                const badPayload = new TextDecoder().decode(arrayBuffer);
                console.error("CRITICAL ERROR: Backend did NOT send a TIFF. It sent this text:", badPayload);
                alert("Backend crashed! Check the browser console to read the Python traceback.");
                return; // Stop execution before geotiff.js attempts to parse text as an image
            }

            // 4. Parse the GeoTIFF using geotiff.js
            const tiff = await GeoTIFF.fromArrayBuffer(arrayBuffer);
            const image = await tiff.getImage();
            const rasters = await image.readRasters();
            
            // 5. Extract the single band of probabilities and dimensions
            const probabilityData = rasters[0]; 
            const width = image.getWidth();
            const height = image.getHeight();

            // 6. Convert float32 array into a visible image via an HTML Canvas
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.createImageData(width, height);
            // Loop through the data and assign RGBA values
            for (let i = 0; i < probabilityData.length; i++) {
                const val = probabilityData[i]; // Value between 0.0 and 1.0
                const index = i * 4;            // 4 bytes per pixel (R, G, B, A) 
                
                if (val == -1) { // still forested
                    imageData.data[index + 0] = 0;                        
                    imageData.data[index + 1] = 128;                         
                    imageData.data[index + 2] = 0;  
                    imageData.data[index + 3] = 255;  
                } else if (val == 1) { // deforested
                    imageData.data[index + 0] = 255;                        
                    imageData.data[index + 1] = 71;                         
                    imageData.data[index + 2] = 87; 
                    imageData.data[index + 3] = 255;
                } else {
                    // Make the pixel completely invisible
                    imageData.data[index + 0] = 0; 
                    imageData.data[index + 1] = 0; 
                    imageData.data[index + 2] = 0; 
                    imageData.data[index + 3] = 0; 
                }
            }

            // Put the painted pixels back onto the canvas
            ctx.putImageData(imageData, 0, 0);

            // 5. Convert canvas to a Base64 Image URL
            const dataUrl = canvas.toDataURL('image/png');

            // 6. Calculate Bounding Box and Render
            const coordinates = calculateBoundingBox(latestFeature.geometry.coordinates[0]);
            renderImageOverlay(dataUrl, coordinates);

        } catch (error) {
            console.error("Failed to process polygon:", error);
        }
    }

    // Utility: Calculate min/max lat/lng to get the 4 corners for the image source
    function calculateBoundingBox(polygonCoords) {
        let minLng = Infinity, minLat = Infinity, maxLng = -Infinity, maxLat = -Infinity;
        
        polygonCoords.forEach(coord => {
            if (coord[0] < minLng) minLng = coord[0];
            if (coord[1] < minLat) minLat = coord[1];
            if (coord[0] > maxLng) maxLng = coord[0];
            if (coord[1] > maxLat) maxLat = coord[1];
        });

        // MapLibre expects image source coordinates in a specific order:
        // [top-left, top-right, bottom-right, bottom-left]
        return [
            [minLng, maxLat], // Top-Left
            [maxLng, maxLat], // Top-Right
            [maxLng, minLat], // Bottom-Right
            [minLng, minLat]  // Bottom-Left
        ];
    }

    // Utility: Add or update the map layer with the new image
    function renderImageOverlay(imageUrl, coordinates) {
        // If the source already exists, update it rather than duplicating
        if (map.getSource('prediction-overlay')) {
            map.getSource('prediction-overlay').updateImage({ url: imageUrl, coordinates: coordinates });
        } else {
            map.addSource('prediction-overlay', {
                type: 'image',
                url: imageUrl,
                coordinates: coordinates
            });

            map.addLayer({
                id: 'prediction-overlay-layer',
                type: 'raster',
                source: 'prediction-overlay',
                paint: {
                    'raster-opacity': 0.7,
                    'raster-fade-duration': 0
                }
            });
        }
    }

    
</script>
</body>
</html>
