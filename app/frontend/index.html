<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForestWatch</title>
    
    <link href="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl-html-widget@latest/src/maplibre-gl-html-widget.css">
    <script src="https://unpkg.com/maplibre-gl-html-widget@latest/src/maplibre-gl-html-widget.js"></script>

    <link href="https://unpkg.com/@mapbox/mapbox-gl-draw@1.4.3/dist/mapbox-gl-draw.css" rel="stylesheet" />
    <script src="https://unpkg.com/@mapbox/mapbox-gl-draw@1.4.3/dist/mapbox-gl-draw.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/geotiff"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { width: 100%; height: 100%; }

        /* Increase the physical size of the control buttons */
        .mapboxgl-ctrl-group button {
            width: 45px !important;
            height: 45px !important;
        }

        /* Scale up the SVG icons inside the buttons so they don't look tiny */
        .mapboxgl-ctrl-group button .mapbox-gl-draw_ctrl-draw-btn .mapboxgl-ctrl-icon,
        .mapboxgl-ctrl-icon {
            transform: scale(1.5); 
        }

        /* Block Mapbox Draw toolbar while a prediction is in flight */
        #map.draw-locked .maplibregl-ctrl-group button {
            pointer-events: none;
            opacity: 0.45;
            cursor: not-allowed;
        }

        .year-picker {
            min-width: 200px;
            padding: 12px 14px;
            font-family: system-ui, -apple-system, sans-serif;
            color: #1a1a1a;
        }

        .year-picker__label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #5a5a5a;
            margin-bottom: 4px;
        }

        .year-picker__value {
            display: block;
            font-size: 28px;
            font-weight: 700;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
            margin-bottom: 10px;
        }

        .year-picker__slider {
            width: 100%;
            margin: 0;
            accent-color: #2d6a4f;
            cursor: pointer;
        }

        .year-picker.is-locked {
            opacity: 0.55;
            pointer-events: none;
        }

        .year-picker__slider:disabled {
            cursor: not-allowed;
        }

        .year-picker__bounds {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            font-size: 11px;
            color: #6b6b6b;
            font-variant-numeric: tabular-nums;
        }

        .compare-toggle {
            min-width: 200px;
            padding: 12px 14px;
            font-family: system-ui, -apple-system, sans-serif;
            color: #1a1a1a;
        }

        .compare-toggle__label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: #1a1a1a;
        }

        .compare-toggle__checkbox {
            width: 16px;
            height: 16px;
            margin: 0;
            accent-color: #2d6a4f;
            cursor: pointer;
            flex-shrink: 0;
        }

        .compare-toggle__text {
            line-height: 1.2;
        }

        .confusion-legend {
            min-width: 200px;
            padding: 12px 14px;
            font-family: system-ui, -apple-system, sans-serif;
            color: #1a1a1a;
        }

        .confusion-legend.is-hidden {
            display: none;
        }

        .confusion-legend__title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #5a5a5a;
            margin-bottom: 10px;
        }

        .confusion-legend__list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .confusion-legend__item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .confusion-legend__swatch {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            flex-shrink: 0;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
            background: #ccc;
        }

        .confusion-legend__label {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.02em;
            line-height: 1.2;
        }

        .confusion-legend__note {
            margin: 10px 0 0;
            font-size: 11px;
            color: #6b6b6b;
        }
    </style>
</head>
<body>

<div id='map'></div>

<script src="app.js"></script>
</body>
</html>
