<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI + MapLibre + Draw</title>
    
    <link href="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.js"></script>

    <link href="https://unpkg.com/@mapbox/mapbox-gl-draw@1.4.3/dist/mapbox-gl-draw.css" rel="stylesheet" />
    <script src="https://unpkg.com/@mapbox/mapbox-gl-draw@1.4.3/dist/mapbox-gl-draw.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/geotiff"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { width: 100%; height: 100%; }

        /* Increase the physical size of the control buttons */
        .mapboxgl-ctrl-group button {
            width: 45px !important;
            height: 45px !important;
        }

        /* Scale up the SVG icons inside the buttons so they don't look tiny */
        .mapboxgl-ctrl-group button .mapbox-gl-draw_ctrl-draw-btn .mapboxgl-ctrl-icon,
        .mapboxgl-ctrl-icon {
            transform: scale(1.5); 
        }

        /* Block Mapbox Draw toolbar while a prediction is in flight */
        #map.draw-locked .maplibregl-ctrl-group button {
            pointer-events: none;
            opacity: 0.45;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div id='map'></div>

<script src="app.js"></script>
</body>
</html>
